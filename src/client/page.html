<title>Muhurat</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;600;800&display=swap">
<style>
/* Layout: one screen. The wedding lawn fills the frame; menus sit over it like an invitation card. */
:root {
  --night: #0b1f1c; --lawn: #15493e; --marigold: #f6a821; --rani: #e0347a; --cream: #fff3d6; --ink: #0a1614; --danger: #e5483b; --good: #58c777;
  --display: "Yatra One", "Trebuchet MS", sans-serif; --body: Mukta, "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--cream); font-family: var(--body); font-size: 16px; overflow: hidden; }
#stage { position: relative; height: 100%; box-sizing: border-box; padding-inline: 16px; padding-block: 8px; display: flex; align-items: center; justify-content: center; }
#stage > .fit { position: absolute; inset: 8px 16px; display: flex; align-items: center; justify-content: center; }
canvas { display: block; border-radius: 10px; background: var(--lawn); touch-action: none; }
.card { position: absolute; z-index: 2; width: min(420px, calc(100% - 32px)); max-height: calc(100% - 16px); overflow: auto; box-sizing: border-box; background: var(--cream); color: var(--ink); border: 3px solid var(--marigold); outline: 3px solid var(--rani); outline-offset: 3px; border-radius: 6px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; text-align: center; }
h1 { font-family: var(--display); font-weight: 400; font-size: 52px; line-height: 1; margin: 0; color: var(--rani); text-wrap: balance; }
h2 { font-family: var(--display); font-weight: 400; font-size: 34px; line-height: 1.05; margin: 0; color: var(--rani); text-wrap: balance; }
#end[data-won="false"] h2 { color: var(--danger); }
p { margin: 0; line-height: 1.4; }
.small { font-size: 14px; opacity: .8; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 120px; min-width: 0; }
input { font: inherit; padding: 10px 12px; border: 2px solid var(--ink); border-radius: 6px; background: #fff; color: var(--ink); box-sizing: border-box; width: 100%; color-scheme: light; }
#code { text-transform: uppercase; letter-spacing: .2em; font-weight: 800; }
button { font: inherit; font-weight: 800; padding: 11px 14px; border: 0; border-radius: 6px; background: var(--ink); color: var(--cream); cursor: pointer; }
button.main { background: var(--rani); color: #fff; font-size: 18px; }
button:hover { filter: brightness(1.12); }
button:focus-visible, input:focus-visible { outline: 3px solid var(--marigold); outline-offset: 2px; }
#msg { color: var(--danger); font-weight: 800; min-height: 1.2em; }
#headline { font-size: 18px; font-weight: 600; }
.float { position: absolute; z-index: 1; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); }
#start { left: 50%; transform: translateX(-50%); background: var(--marigold); color: var(--ink); font-size: 20px; padding: 14px 26px; }
#drop { right: 28px; background: rgba(10, 22, 20, .8); border: 2px solid var(--cream); }
</style>
<div id="stage">
  <div class="fit"><canvas id="lawn" aria-label="The wedding lawn"></canvas></div>
  <div id="menu" class="card">
    <h1>Muhurat</h1>
    <p>Run the shaadi. Keep the relatives fed, seated and calm until the muhurat.</p>
    <p class="small">Walk into a stall to pick up. Walk into a guest to serve. Move with WASD, arrows or by dragging. Space drops what you hold.</p>
    <input id="name" maxlength="12" placeholder="Your name" autocomplete="off">
    <button id="solo" class="main">Play today's shaadi</button>
    <div id="rooms" class="row">
      <button id="create">Create a room</button>
      <input id="code" maxlength="5" placeholder="CODE" autocomplete="off">
      <button id="join">Join</button>
    </div>
    <p id="seedline" class="small"></p>
    <p id="msg" role="alert"></p>
  </div>
  <div id="end" class="card" hidden>
    <h2 id="verdict"></h2>
    <p id="headline"></p>
    <p id="score" class="small"></p>
    <div class="row">
      <button id="again" class="main">Same shaadi again</button>
      <button id="fresh">New shaadi</button>
    </div>
    <button id="copy">Copy link to this shaadi</button>
    <input id="link" readonly hidden>
  </div>
  <button id="start" class="float" hidden>Start the shaadi</button>
  <button id="drop" class="float" hidden>Drop</button>
</div>
